<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<title>PaperCraft｜论文叙事与精修</title>
<desc>同材料的中文摘述，展示从步骤清单到问题与取舍的变化。所有数字均为教学构造值。</desc>
<rect width="1280" height="640" fill="#FAFBFA"/>
<rect x="0" y="0" width="1280" height="8" fill="#276682"/>
<text x="56" y="91" font-family="Arial" font-size="54" font-weight="700" fill="#193A48">PaperCraft</text>
<text x="59" y="139" font-family="Microsoft YaHei" font-size="27" font-weight="400" fill="#465E68">论文叙事与精修</text>
<text x="884" y="88" font-family="Microsoft YaHei" font-size="21" font-weight="400" fill="#276682">从步骤清单，写出问题与取舍</text>
<path d="M56,176 L1224,176" stroke="#D8E2E6" stroke-width="1"/>
<text x="58" y="229" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#687C83">原稿摘述</text>
<text x="58" y="286" font-family="Microsoft YaHei" font-size="34" font-weight="400" fill="#50656F">比较三种操作模式，</text>
<text x="58" y="338" font-family="Microsoft YaHei" font-size="34" font-weight="400" fill="#50656F">记录九行结果。</text>
<text x="58" y="403" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#607681">L 模式：漂移 19 μm，就位 32 秒。</text>
<path d="M529,221 L529,465" stroke="#D8E2E6" stroke-width="1"/>
<text x="584" y="229" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#276682">改后主线</text>
<text x="584" y="286" font-family="Microsoft YaHei" font-size="39" font-weight="700" fill="#193A48">关键在于</text>
<text x="584" y="338" font-family="Microsoft YaHei" font-size="39" font-weight="700" fill="#193A48">何时锁住压头。</text>
<text x="584" y="391" font-family="Microsoft YaHei" font-size="25" font-weight="400" fill="#324F5C">先就位再锁定，相比全程自由：</text>
<text x="584" y="436" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#276682">漂移 125 → 19 μm；就位 17 → 32 秒。</text>
<text x="58" y="481" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#607681">同一斜面记录；平面无重复性收益，另一方向的斜面仍未矫正。</text>
<path d="M56,505 L1224,505" stroke="#D8E2E6" stroke-width="1"/>
<text x="58" y="551" font-family="Microsoft YaHei" font-size="25" font-weight="400" fill="#193A48">Word 清稿 · 黄色审阅稿 · PDF</text>
<text x="58" y="597" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#607681">中文摘述 · 教学构造数据</text>
<text x="1050" y="597" font-family="Arial" font-size="20" font-weight="400" fill="#607681">zlsjtj/PaperCraft</text>
</svg>
