<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="63mm" viewBox="0 0 453.5433070866142 178.58267716535434"><title>Specified reference-examination allowances</title><desc>Both policies cap examinations at 64. Reserve allocates separate caps of 48 and 16, with no budget borrowing. Bars represent allowances, not measured work or duration.</desc><text x="12" y="19" font-family="Arial" font-size="11" font-weight="700" fill="#263B48">Same scan ceiling, different allocation</text><text x="12" y="61" font-family="Arial" font-size="10" font-weight="700" fill="#263B48">Cap64</text><rect x="102" y="42" width="336" height="27" fill="#D7E8EF"/><text x="160" y="59" font-family="Arial" font-size="10" font-weight="400" fill="#263B48">Up to 64 foreground examinations</text><text x="12" y="106" font-family="Arial" font-size="10" font-weight="700" fill="#263B48">Reserve</text><rect x="102" y="87" width="252" height="27" fill="#D7E8EF"/><rect x="354" y="87" width="84" height="27" fill="#F1D9A4"/><text x="164" y="104" font-family="Arial" font-size="10" font-weight="400" fill="#263B48">Up to 48 foreground</text><text x="365" y="104" font-family="Arial" font-size="10" font-weight="400" fill="#263B48">Up to 16</text><text x="289" y="134" font-family="Arial" font-size="9" font-weight="400" fill="#263B48">Maintenance after every request</text><text x="102" y="164" font-family="Arial" font-size="10" font-weight="400" fill="#263B48">Soft free-space target: 4, 8 or 16 MiB</text></svg>