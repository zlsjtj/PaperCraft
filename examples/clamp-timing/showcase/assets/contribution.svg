<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>同一套夹具，改变的是锁定时机</title><rect x="0" y="0" width="1280" height="800" fill="#FAF8F3"/><text x="54" y="57" font-family="Microsoft YaHei" font-weight="700" font-size="23" fill="#203139">PaperCraft</text><text x="990" y="57" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">01 / 创新定位</text><path d="M54,78 L1226,78" stroke="#D9DDD9" stroke-width="1"/><text x="54" y="144" font-family="Microsoft YaHei" font-weight="700" font-size="42" fill="#203139">同一套夹具，改变的是锁定时机</text><text x="55" y="189" font-family="Microsoft YaHei" font-weight="400" font-size="20" fill="#596970">英文原稿与清稿的中文摘述 · 公开教学构造案例</text><text x="55" y="260" font-family="Microsoft YaHei" font-weight="700" font-size="24" fill="#596970">原稿</text><text x="661" y="260" font-family="Microsoft YaHei" font-weight="700" font-size="24" fill="#A44732">改稿</text><path d="M625,233 L625,463" stroke="#D9DDD9" stroke-width="1"/><text x="55" y="308" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#596970">比较了已有压头的三种模式，记录包含九行</text><text x="55" y="351" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#596970">结果。L 模式在斜面条件下的力变异系数为 </text><text x="55" y="394" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#596970">2.3%，漂移为 19 μm。其他条件也有差异。</text><text x="661" y="308" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#203139">压头转动有助于贴合斜面，但加载时保持自由</text><text x="661" y="351" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#203139">也可能漂移。比较的关键是何时锁住：先贴合，</text><text x="661" y="394" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#203139">再锁定，并为较低漂移付出额外准备时间。</text><text x="55" y="527" font-family="Microsoft YaHei" font-weight="700" font-size="27" fill="#203139">同一斜面，F → L：收益与代价一起出现</text><text x="55" y="585" font-family="Microsoft YaHei" font-weight="400" font-size="22" fill="#596970">加载期间漂移</text><text x="55" y="641" font-family="Microsoft YaHei" font-weight="700" font-size="38" fill="#276C81">125 → 19 μm</text><text x="467" y="585" font-family="Microsoft YaHei" font-weight="400" font-size="22" fill="#596970">准备时间</text><text x="467" y="641" font-family="Microsoft YaHei" font-weight="700" font-size="38" fill="#276C81">17 → 32 s</text><text x="877" y="585" font-family="Microsoft YaHei" font-weight="400" font-size="22" fill="#596970">末端力 CV</text><text x="877" y="641" font-family="Microsoft YaHei" font-weight="700" font-size="38" fill="#276C81">2.1 → 2.3%</text><text x="55" y="710" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">CV 差异不能据此判定等效或显著；平面与横向斜面结果仍在完整稿中。</text><path d="M54,743 L1226,743" stroke="#D9DDD9" stroke-width="1"/><text x="55" y="776" font-family="Microsoft YaHei" font-weight="400" font-size="17" fill="#596970">来源：input/rough.docx · input/implementation.md · clean.docx · input/results.csv</text></svg>