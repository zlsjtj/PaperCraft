<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>把操作写成有理由的设计决定</title><rect x="0" y="0" width="1280" height="800" fill="#FAF8F3"/><text x="54" y="57" font-family="Microsoft YaHei" font-weight="700" font-size="23" fill="#203139">PaperCraft</text><text x="990" y="57" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">02 / 技术工作</text><path d="M54,78 L1226,78" stroke="#D9DDD9" stroke-width="1"/><text x="54" y="144" font-family="Microsoft YaHei" font-weight="700" font-size="42" fill="#203139">把操作写成有理由的设计决定</text><text x="55" y="189" font-family="Microsoft YaHei" font-weight="400" font-size="20" fill="#596970">英文原稿与清稿的中文摘述 · 公开教学构造案例</text><text x="55" y="260" font-family="Microsoft YaHei" font-weight="700" font-size="24" fill="#596970">原稿</text><text x="661" y="260" font-family="Microsoft YaHei" font-weight="700" font-size="24" fill="#A44732">改稿</text><path d="M625,233 L625,463" stroke="#D9DDD9" stroke-width="1"/><text x="55" y="311" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#596970">自由接近，保持预载后锁定；锁前需要预载</text><text x="55" y="355" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#596970">确认，随后置零并加载。每种模式使用相同</text><text x="55" y="399" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#596970">夹具和设置。</text><text x="661" y="311" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#203139">先确认预载保持，再在不抬起压头的情况下锁</text><text x="661" y="355" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#203139">定，让锁止作用于已就位姿态。锁后置零，统</text><text x="661" y="399" font-family="Microsoft YaHei" font-weight="400" font-size="27" fill="#203139">一加载增量的起点。</text><path d="M55,523 L310,523" stroke="#276C81" stroke-width="2"/><text x="55" y="570" font-family="Microsoft YaHei" font-weight="700" font-size="25" fill="#203139">确认预载</text><text x="55" y="614" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">缺确认则终止</text><path d="M353,523 L608,523" stroke="#276C81" stroke-width="2"/><text x="353" y="570" font-family="Microsoft YaHei" font-weight="700" font-size="25" fill="#203139">不抬起地锁定</text><text x="353" y="614" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">保留已就位姿态</text><path d="M651,523 L906,523" stroke="#276C81" stroke-width="2"/><text x="651" y="570" font-family="Microsoft YaHei" font-weight="700" font-size="25" fill="#203139">锁后置零</text><text x="651" y="614" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">统一增量起点</text><path d="M949,523 L1204,523" stroke="#276C81" stroke-width="2"/><text x="949" y="570" font-family="Microsoft YaHei" font-weight="700" font-size="25" fill="#203139">加载 0.20 mm</text><text x="949" y="614" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">卸载后才解锁</text><text x="55" y="703" font-family="Microsoft YaHei" font-weight="400" font-size="21" fill="#596970">必要性来自实现说明；现有记录全部收到确认，不能写成已经测过故障恢复。</text><path d="M54,743 L1226,743" stroke="#D9DDD9" stroke-width="1"/><text x="55" y="776" font-family="Microsoft YaHei" font-weight="400" font-size="17" fill="#596970">来源：input/rough.docx · input/implementation.md · clean.docx · input/results.csv</text></svg>